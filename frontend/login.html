<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Nexusolutions</title><meta name="description" content="Log in to your Nexusolutions account."><link rel="stylesheet" href="css/style.css"></head>
<body><main class="login-page">
<a href="index.html" class="logo">Nexu<span>solutions</span></a>
<div class="login-box">
  <h2>Login</h2>
  <p class="subtitle">Welcome back. Enter your details to continue.</p>
  <div id="form-message" class="alert error" role="alert" style="display:none"></div>
  <form id="login-form" novalidate>
    <label for="email">Email</label>
    <input type="text" id="email" autocomplete="username">
    <div id="email-error" class="error-text"></div>
    <label for="password">Password</label>
    <div class="password-box"><input type="password" id="password" autocomplete="current-password"><button type="button" id="show-password">Show</button></div>
    <div id="password-error" class="error-text"></div>
    <button type="submit" id="login-button" class="btn-primary">Login</button>
  </form>
  <p class="small-text">No account yet? <a href="register.php">Create one</a></p>
  <p class="small-text"><a href="index.html">&larr; Back to home</a></p>
</div></main>
<script src="js/script.js"></script></body></html>
